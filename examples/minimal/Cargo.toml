[package]
name = "fluent-codegen-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/SDA-31/fluent_typed_codegen"
license = "MIT"
publish = false

[package.metadata.localization]
asset-root = "assets"
catalog = "localizations/localization.toml"

[dependencies]
l10n = { package = "fluent_typed_codegen", path = "../..", default-features = false }
fluent-typed = { version = "0.9.0", default-features = false, features = ["langneg"] }
fluent-syntax = "0.12"
icu_decimal = { version = "2.3", features = ["alloc"] }
icu_locale_core = "2.3"
icu_plurals = "2.3"

[build-dependencies]
l10n = { package = "fluent_typed_codegen", path = "../..", default-features = false, features = ["build"] }
