name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Tests / ${{ matrix.os }} / Rust ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: ubuntu-latest
            rust: '1.95.0'
          - os: windows-latest
            rust: stable
          - os: macos-latest
            rust: stable
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Restore Cargo cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            target
          key: generator-test-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rust }}-${{ hashFiles('**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            generator-test-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rust }}-${{ hashFiles('**/Cargo.toml') }}-
      - name: Resolve standalone dependency graphs
        run: |
          rustc --version
          cargo generate-lockfile
          cargo generate-lockfile --manifest-path examples/minimal/Cargo.toml
      - name: Test generator and doctests
        run: cargo test --locked
      - name: Test macro-only API
        run: cargo test --locked --no-default-features
      - name: Check macro-only dependency isolation
        run: |
          cargo tree --locked --no-default-features --edges normal,build --prefix none > "$CARGO_TARGET_DIR/macro-dependencies.txt"
          test "$(wc -l < "$CARGO_TARGET_DIR/macro-dependencies.txt")" -eq 1
      - name: Test and run the generated consumer
        run: |
          cargo test --locked --manifest-path examples/minimal/Cargo.toml
          cargo run --locked --manifest-path examples/minimal/Cargo.toml

  quality:
    name: Formatting, Clippy, docs and package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: stable
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Restore Cargo cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            target
          key: generator-quality-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            generator-quality-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.toml') }}-
      - name: Check formatting, including the nested example
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path examples/minimal/Cargo.toml --all -- --check
      - name: Resolve standalone dependency graphs
        run: |
          cargo generate-lockfile
          cargo generate-lockfile --manifest-path examples/minimal/Cargo.toml
      - name: Clippy
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --no-default-features -- -D warnings
          cargo clippy --locked --manifest-path examples/minimal/Cargo.toml --all-targets -- -D warnings
      - name: Build documentation with and without generation
        run: |
          cargo doc --locked --no-deps
          cargo doc --locked --no-deps --no-default-features
      - name: Verify the distributable archive without uploading
        run: |
          cargo package --locked --list
          cargo package --locked
