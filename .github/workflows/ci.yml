name: CI

on:
  push:
    branches:
      - main
    tags:
      - '**'
    paths-ignore:
      - 'CHANGELOG.md'
  pull_request:
    paths-ignore:
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Tests / ${{ matrix.os }} / Rust ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: ubuntu-latest
            rust: '1.95.0'
          - os: windows-latest
            rust: stable
          - os: macos-latest
            rust: stable
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Identify the installed compiler
        id: compiler
        run: |
          echo "revision=$(rustc -vV | sed -n 's/^commit-hash: //p')" >> "$GITHUB_OUTPUT"
      - name: Cache downloaded crates
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/registry
          key: generator-registry-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            generator-registry-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore compiled dependencies
        id: dependencies
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target
          key: generator-dependencies-v2-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.revision }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            generator-dependencies-v2-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.revision }}-
      - name: Test generator and doctests
        run: cargo test --locked --features manifest
      - name: Test macro-only API
        run: cargo test --locked --no-default-features
      - name: Test optional runtime manifest parser
        run: cargo test --locked --no-default-features --features manifest
      - name: Check manifest-only dependency isolation
        run: |
          cargo tree --locked --no-default-features --features manifest --edges normal,build --prefix none > "$CARGO_TARGET_DIR/manifest-dependencies.txt"
          if grep -E '^(fluent-typed|fluent-syntax|syn|quote|proc-macro2|prettyplease) v' "$CARGO_TARGET_DIR/manifest-dependencies.txt"; then
            exit 1
          fi
      - name: Check macro-only dependency isolation
        run: |
          cargo tree --locked --no-default-features --edges normal,build --prefix none > "$CARGO_TARGET_DIR/macro-dependencies.txt"
          test "$(wc -l < "$CARGO_TARGET_DIR/macro-dependencies.txt")" -eq 1
      - name: Test and run the generated consumer
        run: |
          cargo test --locked --manifest-path examples/minimal/Cargo.toml
          cargo run --locked --manifest-path examples/minimal/Cargo.toml
      - name: Remove project artifacts before caching dependencies
        if: ${{ github.ref == 'refs/heads/main' && steps.dependencies.outputs.cache-hit != 'true' }}
        run: |
          cargo clean --locked --offline --workspace --manifest-path Cargo.toml --target-dir "$CARGO_TARGET_DIR"
          cargo clean --locked --offline --workspace --manifest-path examples/minimal/Cargo.toml --target-dir "$CARGO_TARGET_DIR"
          cargo clean --locked --offline --doc --target-dir "$CARGO_TARGET_DIR"
      - name: Save compiled dependencies for descendant PRs
        if: ${{ github.ref == 'refs/heads/main' && steps.dependencies.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target
          key: ${{ steps.dependencies.outputs.cache-primary-key }}

  quality:
    name: Formatting, Clippy, docs and package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: stable
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Identify the installed compiler
        id: compiler
        run: |
          echo "revision=$(rustc -vV | sed -n 's/^commit-hash: //p')" >> "$GITHUB_OUTPUT"
      - name: Cache downloaded crates
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/registry
          key: generator-registry-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            generator-registry-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore compiled dependencies
        id: dependencies
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target
          key: generator-dependencies-v2-quality-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.revision }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            generator-dependencies-v2-quality-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.revision }}-
      - name: Check formatting, including the nested example
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path examples/minimal/Cargo.toml --all -- --check
      - name: Clippy
        run: |
          cargo clippy --locked --all-targets --features manifest -- -D warnings
          cargo clippy --locked --all-targets --no-default-features -- -D warnings
          cargo clippy --locked --all-targets --no-default-features --features manifest -- -D warnings
          cargo clippy --locked --manifest-path examples/minimal/Cargo.toml --all-targets -- -D warnings
      - name: Build documentation with and without generation
        run: |
          cargo doc --locked --no-deps --features manifest
          cargo doc --locked --no-deps --no-default-features
      - name: Verify the distributable archive without uploading
        run: |
          cargo package --locked --list
          cargo package --locked
      - name: Remove project artifacts before caching dependencies
        if: ${{ github.ref == 'refs/heads/main' && steps.dependencies.outputs.cache-hit != 'true' }}
        run: |
          cargo clean --locked --offline --workspace --manifest-path Cargo.toml --target-dir "$CARGO_TARGET_DIR"
          cargo clean --locked --offline --workspace --manifest-path examples/minimal/Cargo.toml --target-dir "$CARGO_TARGET_DIR"
          cargo clean --locked --offline --doc --target-dir "$CARGO_TARGET_DIR"
          cargo clean --locked --offline --target-dir "$CARGO_TARGET_DIR/package"
      - name: Save compiled dependencies for descendant PRs
        if: ${{ github.ref == 'refs/heads/main' && steps.dependencies.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
