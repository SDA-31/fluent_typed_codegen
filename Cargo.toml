[package]
name = "fluent_typed_codegen"
version = "0.1.2"
edition = "2024"
rust-version = "1.95"
description = "Automatic Fluent catalog discovery and typed code generation for Cargo"
repository = "https://github.com/SDA-31/fluent_typed_codegen"
documentation = "https://docs.rs/fluent_typed_codegen"
readme = "README.md"
keywords = ["fluent", "localization", "codegen", "i18n"]
categories = ["internationalization", "localization"]
license = "MIT"
publish = ["crates-io"]

[features]
default = ["build"]
build = [
    "dep:fluent-syntax",
    "dep:fluent-typed",
    "fluent-typed/build",
    "dep:proc-macro2",
    "dep:prettyplease",
    "dep:quote",
    "dep:syn",
    "dep:toml_edit",
]

[[example]]
name = "generate"
required-features = ["build"]

[dependencies]
fluent-syntax = { version = "0.12", optional = true }
fluent-typed = { version = "0.9.0", default-features = false, features = ["langneg"], optional = true }
proc-macro2 = { version = "1.0.107", optional = true }
prettyplease = { version = "0.3.0", optional = true }
quote = { version = "1.0.47", optional = true }
syn = { version = "3.0.5", features = ["full", "extra-traits", "visit"], optional = true }
toml_edit = { version = "0.25.15", default-features = false, features = ["parse"], optional = true }
